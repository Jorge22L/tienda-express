<!DOCTYPE html>
<html lang="es"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="https://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>
    <title th:text="${producto.id == null ? 'Nuevo producto' : 'Editar producto'}">
        Producto
    </title>
</head>

<body>

<section layout:fragment="contenido">

    <div class="card bg-secondary text-light shadow">
        <div class="card-header">
            <h1 class="h4 mb-0" th:text="${producto.id == null ? 'Nuevo Producto' : 'Editar Producto'}">
                Formulario Producto
            </h1>
        </div>

        <div class="card-body">
            <form method="post"
                  enctype="multipart/form-data"
                  th:action="${producto.id == null} ? @{/productos/guardar} : @{/productos/actualizar/{id}(id=${producto.id})}"
                  th:object="${producto}">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" th:field="*{nombre}" id="nombre">
                    <div class="text-warning" th:errors="*{nombre}"></div>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea class="form-control" th:field="*{descripcion}" id="descripcion"></textarea>
                </div>

                <div class="mb-3">
                    <label for="precio" class="form-label">Precio</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{precio}" id="precio">
                    <div class="text-warning" th:errors="*{precio}"></div>
                </div>

                <div class="mb-3">
                    <label for="archivoImagen" class="form-label">Imagen</label>
                    <input type="file" class="form-control" id="archivoImagen" name="archivoImagen" accept="image/*">
                </div>

                <div class="mb-3">
                    <label for="stock" class="form-label">Stock</label>
                    <input type="number" class="form-control" th:field="*{stock}" id="stock">
                    <div class="text-warning" th:errors="*{stock}"></div>
                </div>

                <div class="mb-3">
                    <label for="categoria" class="form-label">Categoría</label>
                    <select class="form-select" th:field="*{categoria.id}" id="categoria">
                        <option value="">Seleccione una categoría</option>
                        <option th:each="categoria : ${categorias}"
                                th:value="${categoria.id}"
                                th:text="${categoria.nombre}">
                        </option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success">Guardar</button>
                <a th:href="@{/productos}" class="btn btn-outline-light">Cancelar</a>

            </form>
        </div>
    </div>

</section>

</body>
</html>
