<!DOCTYPE html>
<html lang="es"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="https://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>
    <title>Productos</title>
</head>

<body>

<section layout:fragment="contenido">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Productos</h1>
        <a th:href="@{/productos/nuevo}" class="btn btn-primary">Nuevo producto</a>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3" th:each="producto : ${productos}">
            <div class="card h-100 bg-secondary text-light">
                <img th:src="@{'/uploads/productos/' + ${producto.imagen}}"
                     class="card-img-top"
                     alt="Imagen del producto">

                <div class="card-body">
                    <h5 th:text="${producto.nombre}">Nombre</h5>
                    <p th:text="${producto.descripcion}">Descripción</p>
                    <p><strong>Precio:</strong> $<span th:text="${producto.precio}"></span></p>
                    <p><strong>Stock:</strong> <span th:text="${producto.stock}"></span></p>
                    <p><strong>Categoría:</strong> <span th:text="${producto.categoria.nombre}"></span></p>

                    <a th:href="@{/productos/{id}(id=${producto.id})}" class="btn btn-info btn-sm">Ver</a>
                    <a th:href="@{/productos/editar/{id}(id=${producto.id})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/productos/eliminar/{id}(id=${producto.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Desea eliminar este producto?')">
                        Eliminar
                    </a>
                </div>
            </div>
        </div>
    </div>

</section>

</body>
</html>
