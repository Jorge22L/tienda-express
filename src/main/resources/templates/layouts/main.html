<!DOCTYPE html>
<html lang="es"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="https://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$CONTENT_TITLE - Tienda Express">
        Tienda Express
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-black">
    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/}">
            Tienda Express
        </a>

        <div class="navbar-nav">

            <a class="nav-link"
               th:href="@{/}">
                Inicio
            </a>

            <a class="nav-link"
               th:href="@{/productos}">
                Productos
            </a>

            <a class="nav-link"
               th:href="@{/productos/nuevo}">
                Nuevo Producto
            </a>

        </div>

    </div>
</nav>

<main class="container mt-4 mb-5" layout:fragment="contenido">
    <!-- Aquí se inyecta el contenido de cada página -->
</main>

<footer class="bg-black text-center text-secondary py-3 border-top border-secondary">
    <small>© 2026 Tienda Express - Proyecto académico</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</html>
